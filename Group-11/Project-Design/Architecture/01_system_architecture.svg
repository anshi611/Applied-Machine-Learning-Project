ight="400" fill="#1f2328" text-anchor="middle">train_uplift.py (T-learner, Qini)</text><text x="220.0" y="294" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">business_roi.py · score_customers.py</text><rect x="45" y="405" width="350" height="45" rx="8" fill="#f7f7f8" stroke="#5b6470" stroke-width="1.6"/><text x="220.0" y="432.0" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">params.yaml (offer cost, CLV, thresholds)</text><rect x="45" y="475" width="350" height="120" rx="8" fill="#fdf5e9" stroke="#c98a1b" stroke-width="1.6"/><text x="220.0" y="495" font-size="13.5" font-weight="700" fill="#c98a1b" text-anchor="middle">Saved artifacts</text><text x="220.0" y="514" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">models/best_churn_model.joblib</text><text x="220.0" y="530" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">models/uplift_model.joblib</text><text x="220.0" y="546" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">results/*.json · figures/*.png</text><text x="220.0" y="562" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">backend/data/mydel_customers.csv</text><rect x="45" y="620" width="350" height="95" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="220.0" y="640" font-size="13.5" font-weight="700" fill="#4C72B0" text-anchor="middle">Jupyter notebooks</text><text x="220.0" y="659" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">01_eda.ipynb · 02_modelling.ipynb</text><text x="220.0" y="675" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">(+ Google Colab versions)</text><path d="M220,150 L220,175" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M220,380 L220,405" fill="none" stroke="#9aa1ab" stroke-width="1.6"/><path d="M220,450 L220,475" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="450" y="6