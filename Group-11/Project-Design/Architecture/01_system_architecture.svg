nt-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">decide() → recommended action</text><rect x="475" y="530" width="350" height="75" rx="8" fill="#f3f0fa" stroke="#8172B3" stroke-width="1.6"/><text x="650.0" y="550" font-size="13.5" font-weight="700" fill="#8172B3" text-anchor="middle">database.py: Database</text><text x="650.0" y="569" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">contacts · predictions tables</text><rect x="475" y="635" width="350" height="80" rx="8" fill="#fdf5e9" stroke="#c98a1b" stroke-width="1.6"/><text x="650.0" y="655" font-size="13.5" font-weight="700" fill="#c98a1b" text-anchor="middle">SQLite</text><text x="650.0" y="674" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">mydel.db</text><path d="M650,250 L650,280" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650,350 L650,380" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650,500 L650,530" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M650,605 L650,635" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M395,535 L475,440" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="366.4" y="458" width="137.2" height="16" fill="#ffffff" opacity="0.9"/><text x="435" y="470" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">joblib / CSV / JSON</text><rect x="880" y="60" width="400" height="680" rx="12" fill="none" stroke="#2e8b57" stroke-width="1.4" stroke-dasharray="7 5"/><text x="894" y="82" font-size="13.5" font-weight="700" fill="#2e8b57" text-anchor="start">3 · Frontend (React 18 + Vite + Recharts)</text><rect x="905" y="100" width="350" height="100" rx="8" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1080.0" y="120" font-size="13.5" font-weight="700" fill="#2e8b57" text-anchor="middle">Role-based dashboards</text><text x="1080.0" y="139" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Manager · Support Agent · Data Scientist</text><text x="1080.0" y="155" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">(ViewModeContext persona switcher)</text><rect x="905" y="225" width="350" height="120" rx="8" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1080.0" y="245" font-size="13.5" font-weight="700" fill="#2e8b57" text-anchor="middle">Shared pages</text><text x="1080.0" y="264" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Customers · Customer detail + contact log</text><text x="1080.0" y="280" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Campaign planner · Models</text><text x="1080.0" y="296" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Live predictor</text><rect x="905" y="370" width="350" height="60" rx="8" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1080.0" y="404.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">api.js: fetch() → JSON</text><rect x="905" y="470" width="350" height="95" rx="8" fill="#f7f7f8" stroke="#5b6470" stroke-width="1.6"/><text x="1080.0" y="490" font-size="13.5" font-weight="700" fill="#5b6470" text-anchor="middle">Users (browser)</text><text x="1080.0" y="509" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">👔 Manager   🎧 Support agent</text><text x="1080.0" y="525" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">🔬 Data scientist / examiner</text><rect x="905" y="600" width="350" height="115" rx="8" fill="#f7f7f8" stroke="#5b6470" stroke-width="1.6"/><text x="1080.0" y="620" font-size="13.5" font-weight="700" fill="#5b6470" text-anchor="middle">Deployment</text><text x="1080.0" y="639" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Frontend → Vercel (vercel.json)</text><text x="1080.0" y="655" font-size="12.5" font-weight="400" fill="