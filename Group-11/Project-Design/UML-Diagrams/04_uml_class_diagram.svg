<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1ab"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1f2328"/></marker></defs><rect width="1300" height="820" fill="#ffffff"/><text x="650.0" y="34" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">UML Class Diagram: Backend and Uplift Model</text><rect x="470" y="60" width="360" height="202" fill="#f3f0fa" stroke="#8172B3" stroke-width="1.6"/><text x="650.0" y="79" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle">«module»</text><text x="650.0" y="97" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">main (FastAPI app)</text><line x1="470" y1="106" x2="830" y2="106" stroke="#8172B3"/><text x="480" y="126" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">service: ModelService</text><text x="480" y="143" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">db: Database</text><line x1="470" y1="150" x2="830" y2="150" stroke="#8172B3"/><text x="480" y="170" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">health() / summary() / metrics()</text><text x="480" y="187" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">customers(q, risk, contract, action, …)</text><text x="480" y="204" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">customer_detail(customer_id)</text><text x="480" y="221" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">predict(customer, save) → PredictionResponse</text><text x="480" y="238" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">add/update/delete_contact(…)</text><text x="480" y="255" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">contact_stats() / prediction_history()</text><rect x="40" y="360" width="400" height="254" fill="#f3f0fa" stroke="#8172B3" stroke-width="1.6"/><text x="240.0" y="381" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">ModelService</text><line x1="40" y1="390" x2="440" y2="390" stroke="#8172B3"/><text x="50" y="410" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">churn_model: Pipeline (calibrated RF)</text><text x="50" y="427" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">uplift_treated, uplift_control: Pipeline</text><text x="50" y="444" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">offer_cost, clv_months: float</text><text x="50" y="461" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">low_risk, backfire_margin: float</text><text x="50" y="478" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">customers: DataFrame</text><text x="50" y="495" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">classical, roi, shap: dict</text><line x1="40" y1="502" x2="440" y2="502" stroke="#8172B3"/><text x="50" y="522" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">risk_level(p) → str</text><text x="50" y="539" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">score(df) → DataFrame</text><text x="50" y="556" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">decide(p, uplift, profit) → (action, reason)</text><text x="50" y="573" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">predict_one(features) → dict</text><text x="50" y="590" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">summary() → dict</text><text x="50" y="607" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">list_customers(…) / get_customer(id)</text><rect x="470" y="400" width="360" height="186" fill="#f3f0fa" stroke="#8172B3" stroke-width="1.6"/><text x="650.0" y="421" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Database</text><line x1="470" y1="430" x2="830" y2="430" stroke="#8172B3"/><text x="480" y="450" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">path: Path (mydel.db)</text><line x1="470" y1="457" x2="830" y2="457" stroke="#8172B3"/><text x="480" y="477" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">add_contact(customer_id, data) → dict</text><text x="480" y="494" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">get / update / delete_contact(id)</text><text x="480" y="511" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">contacts_for(customer_id) → list</text><text x="480" y="528" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">recent_contacts(limit, outcome)</text><text x="480" y="545" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">contact_stats() → dict</text><text x="480" y="562" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">log_prediction(features, result)</text><text x="480" y="579" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">prediction_history(limit)</text><rect x="40" y="680" width="400" height="101" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="240.0" y="701" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">TLearner (ml/train_uplift.py)</text><line x1="40" y1="710" x2="440" y2="710" stroke="#4C72B0"/><text x="50" y="730" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">model_treated, model_control: Pipeline</text><line x1="40" y1="737" x2="440" y2="737" stroke="#4C72B0"/><text x="50" y="757" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">fit(X, y, treatment) → self</text><text x="50" y="774" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">predict_uplift(X) → array</text><rect x="880" y="60" width="380" height="134" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1070.0" y="79" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle">«Pydantic»</text><text x="1070.0" y="97" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">CustomerFeatures</text><line x1="880" y1="106" x2="1260" y2="106" stroke="#2e8b57"/><text x="890" y="126" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">gender, SeniorCitizen, Partner, Dependents</text><text x="890" y="143" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">tenure ≥ 0, Contract, PaymentMethod</text><text x="890" y="160" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">InternetService + add-ons, PhoneService</text><text x="890" y="177" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">MonthlyCharges, TotalCharges?</text><line x1="880" y1="184" x2="1260" y2="184" stroke="#2e8b57"/><rect x="880" y="250" width="380" height="134" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1070.0" y="269" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle">«Pydantic»</text><text x="1070.0" y="287" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">PredictionResponse</text><line x1="880" y1="296" x2="1260" y2="296" stroke="#2e8b57"/><text x="890" y="316" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">churn_probability, uplift_score</text><text x="890" y="333" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">customer_value, expected_offer_profit</text><text x="890" y="350" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">risk_level: Low | Medium | High</text><text x="890" y="367" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">recommended_action, reason</text><line x1="880" y1="374" x2="1260" y2="374" stroke="#2e8b57"/><rect x="880" y="450" width="380" height="100" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1070.0" y="469" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle">«Pydantic»</text><text x="1070.0" y="487" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">ContactCreate</text><line x1="880" y1="496" x2="1260" y2="496" stroke="#2e8b57"/><text x="890" y="516" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">channel, action, outcome</text><text x="890" y="533" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">note, agent</text><line x1="880" y1="540" x2="1260" y2="540" stroke="#2e8b57"/><rect x="880" y="600" width="380" height="117" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="1070.0" y="619" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle">«Pydantic»</text><text x="1070.0" y="637" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Contact</text><line x1="880" y1="646" x2="1260" y2="646" stroke="#2e8b57"/><text x="890" y="666" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">id: int</text><text x="890" y="683" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">customer_id: str</text><text x="890" y="700" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">created_at: str</text><line x1="880" y1="707" x2="1260" y2="707" stroke="#2e8b57"/><path d="M1070,600 L1070,550" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#tri)"/><text x="1150" y="590" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle">inherits</text><path d="M560,262 L300,360" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="385.6" y="318" width="48.8" height="16" fill="#ffffff" opacity="0.9"/><text x="410" y="330" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">uses 1</text><path d="M650,262 L650,400" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="665.6" y="363" width="48.8" height="16" fill="#ffffff" opacity="0.9"/><text x="690" y="375" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">uses 1</text><path d="M830,130 L880,130" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="820.4" y="106" width="69.19999999999999" height="16" fill="#ffffff" opacity="0.9"/><text x="855" y="118" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">validates</text><path d="M830,230 L880,300" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="827.2" y="243" width="55.6" height="16" fill="#ffffff" opacity="0.9"/><text x="855" y="255" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">returns</text><path d="M240,680 L240,614" fill="none" stroke="#9aa1ab" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="258.2" y="648" width="123.6" height="16" fill="#ffffff" opacity="0.9"/><text x="320" y="660" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">loaded via joblib</text><text x="470" y="760" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">Database tables: contacts(id, customer_id, channel, action, outcome, note, agent, created_at)</text><text x="470" y="780" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">predictions(id, input_json, churn_probability, uplift_score, risk_level, recommended_action, created_at)</text></svg>