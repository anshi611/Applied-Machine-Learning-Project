text x="40" y="367" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">Counts across 7,043 customers:</text><text x="40" y="386" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">Send offer 2,269</text><text x="40" y="405" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">Call instead 312</text><text x="40" y="424" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">No action 3,460</text><text x="40" y="443" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">Do not contact 1,002</text></svg>