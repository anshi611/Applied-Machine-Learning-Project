<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1ab"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1f2328"/></marker></defs><rect width="1100" height="720" fill="#ffffff"/><text x="550.0" y="34" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">Flowchart: Recommended Action for a Customer (ModelService.decide)</text><rect x="400" y="60" width="300" height="46" rx="8" fill="#f7f7f8" stroke="#5b6470" stroke-width="1.6"/><text x="550.0" y="87.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Customer profile (from list or /predict)</text><rect x="330" y="130" width="440" height="76" rx="8" fill="#f3f0fa" stroke="#8172B3" stroke-width="1.6"/><text x="550.0" y="156.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">p = calibrated churn probability (Random Forest)</text><text x="550.0" y="172.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">u = uplift (T-learner)</text><text x="550.0" y="188.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">profit = u × (12 × MonthlyCharges) − $50</text><path d="M550,106 L550,130" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><polygon points="550,224.0 700.0,270 550,316.0 400.0,270" fill="#fffbea" stroke="#b08900" stroke-width="1.6"/><text x="550" y="266.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">u &lt; −0.02 ?</text><text x="550" y="282.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">(offer may backfire)</text><path d="M550,206 L550,224" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><polygon points="550,364.0 700.0,410 550,456.0 400.0,410" fill="#fffbea" stroke="#b08900" stroke-width="1.6"/><text x="550" y="406.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">p &lt; 0.30 ?</text><text x="550" y="422.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">(low churn risk)</text><polygon points="550,504.0 700.0,550 550,596.0 400.0,550" fill="#fffbea" stroke="#b08900" stroke-width="1.6"/><text x="550" y="546.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">profit &gt; 0 ?</text><text x="550" y="562.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">(offer pays for itself)</text><path d="M550,316 L550,364" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="561.2" y="332" width="21.6" height="16" fill="#ffffff" opacity="0.9"/><text x="572" y="344" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">No</text><path d="M550,456 L550,504" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="561.2" y="472" width="21.6" height="16" fill="#ffffff" opacity="0.9"/><text x="572" y="484" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle">No</text><rect x="830" y="245" width="230" height="50" rx="8" fill="#fdeef1" stroke="#C44E52" stroke-width="1.6"/><text x="945.0" y="274.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Do not contact</text><rect x="830" y="385" width="230" height="50" rx="8" fill="#f7f7f8" stroke="#5b6470" stroke-width="1.6"/><text x="945.0" y="414.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">No action needed</text><rect x="830" y="525" width="230" height="50" rx="8" fill="#eef8f3" stroke="#2e8b57" stroke-width="1.6"/><text x="945.0" y="554.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Send retention offer</text><rect x="420" y="640" width="260" height="50" 