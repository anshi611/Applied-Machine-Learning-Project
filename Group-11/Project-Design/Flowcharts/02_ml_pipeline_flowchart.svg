<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1ab"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#1f2328"/></marker></defs><rect width="1100" height="900" fill="#ffffff"/><text x="550.0" y="34" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">Flowchart: Machine-Learning Pipeline</text><rect x="200" y="70" width="160" height="44" rx="22" fill="#e9e7f5" stroke="#5a4d99" stroke-width="1.6"/><text x="280.0" y="96.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Start</text><rect x="80" y="136" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="280.0" y="161.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Download IBM Telco CSV</text><text x="280.0" y="177.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">download_data.py</text><rect x="80" y="216" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="280.0" y="241.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Clean: TotalCharges blanks → 0,</text><text x="280.0" y="257.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">merge 'No … service', Churn → 1/0</text><rect x="80" y="296" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="280.0" y="321.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Stratified 80/20 split (seed 42)</text><text x="280.0" y="337.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">5,634 train · 1,409 test</text><rect x="80" y="376" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="280.0" y="401.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Train LR / RF / XGBoost in Pipeline</text><text x="280.0" y="417.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">(encode + scale, class weights), 5-fold CV</text><polygon points="280.0,456.0 430.0,501 280.0,546.0 130.0,501" fill="#fffbea" stroke="#b08900" stroke-width="1.6"/><text x="280.0" y="497.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Best test ROC-AUC?</text><text x="280.0" y="513.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">→ Random Forest 0.846</text><rect x="80" y="568" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="280.0" y="593.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Calibrate (Platt / sigmoid)</text><text x="280.0" y="609.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">mean churn 39.4% → 26.7%</text><rect x="80" y="648" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="280.0" y="673.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">SHAP explanations</text><text x="280.0" y="689.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">(top churn drivers)</text><path d="M280.0,114 L280.0,136" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M280.0,194 L280.0,216" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M280.0,274 L280.0,296" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M280.0,354 L280.0,376" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M280.0,434 L280.0,456" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M280.0,546 L280.0,568" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><path d="M280.0,626 L280.0,648" fill="none" stroke="#9aa1ab" stroke-width="1.6" marker-end="url(#ah)"/><rect x="620" y="70" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="820.0" y="95.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Simulate randomised retention offer</text><text x="820.0" y="111.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">50/50 treatment, segment save/backfire rates</text><polygon points="820.0,150.0 980.0,195 820.0,240.0 660.0,195" fill="#fffbea" stroke="#b08900" stroke-width="1.6"/><text x="820.0" y="191.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Base learner by 5-fold CV Qini?</text><text x="820.0" y="207.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">→ Logistic Regression</text><rect x="620" y="262" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="820.0" y="287.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Train T-learner on train set</text><text x="820.0" y="303.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">uplift = P(stay|offer) − P(stay|no offer)</text><rect x="620" y="342" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="820.0" y="367.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Evaluate on test: Qini / gain curves</text><text x="820.0" y="383.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">uplift vs churn risk vs random</text><rect x="620" y="422" width="400" height="58" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="1.6"/><text x="820.0" y="447.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle">Business ROI by campaign size</text><text x="820.0" y="463.5" font-size="12.5" font-weight="400" fill="#1f2328" 