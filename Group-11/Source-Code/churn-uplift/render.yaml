# Render Blueprint for the FastAPI backend.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: mydel-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10            # same as the venv that trained the models
      - key: CORS_ORIGINS         # set to the Vercel URL after the frontend is deployed
        sync: false
